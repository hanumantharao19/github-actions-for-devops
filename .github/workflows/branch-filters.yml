name: Branch Filter Demo

on:
  push:
    branches:
      - main
      - develop

jobs:
  branch-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show branch
        run: 'echo "Workflow running for branch: ${{ github.ref_name }}"'

      - name: Run CI
        run: 'echo "Running CI for ${{ github.ref_name }}"'
