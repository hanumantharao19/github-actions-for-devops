name: GitHub Secrets Demo

on:
  workflow_dispatch:

jobs:

  secrets-demo:
    runs-on: ubuntu-latest

    steps:

      - name: Check secret availability
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "API_TOKEN is configured"
          else
            echo "API_TOKEN is not configured"
          fi

      - name: Use secret in command
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "Secret is available to the workflow"